services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniemail-backend
    ports:
      - "8010:8010"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/outputs:/app/outputs
      - ./backend/data:/app/data
      - ./backend/skills:/app/skills

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniemail-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8010
